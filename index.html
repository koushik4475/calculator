<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b16">
  <meta name="description" content="CyberCalc is a responsive cyberpunk-style calculator for everyday arithmetic.">
  <title>CyberCalc | Koushik HY</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <label class="sr-only" for="result">Calculation display</label>
    <input
      type="text"
      id="result"
      readonly
      inputmode="none"
      autocomplete="off"
      spellcheck="false"
      aria-live="polite"
      aria-label="Calculation display"
    >
    <div class="buttons">
      <button class="clear" type="button" data-action="CLEAR">CLEAR</button>
      <button class="operator" type="button" aria-label="Divide">/</button>
      <button class="operator" type="button" aria-label="Multiply">*</button>
      <button class="operator" type="button" aria-label="Subtract">-</button>
      <button class="number" type="button">7</button>
      <button class="number" type="button">8</button>
      <button class="number" type="button">9</button>
      <button class="operator" type="button" aria-label="Add">+</button>
      <button class="number" type="button">4</button>
      <button class="number" type="button">5</button>
      <button class="number" type="button">6</button>
      <button class="equals" type="button">=</button>
      <button class="number" type="button">1</button>
      <button class="number" type="button">2</button>
      <button class="number" type="button">3</button>
      <button class="number" type="button">0</button>
      <button class="decimal" type="button">.</button>
      <button class="clear" type="button" data-action="CLEAR" aria-label="Clear calculator">C</button>
    </div>
    <p class="keyboard-hint">Keyboard: 0–9, + − × ÷, Enter to calculate, Esc to clear</p>
  </main>
  <script src="index.js"></script>
</body>
</html>
